[workspace]
members = ["cli", "wasm", "capi", "python"]

[package]
name = "wsq-codec"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Decoder and encoder for WSQ (Wavelet Scalar Quantization) fingerprint images"
license = "MIT"
repository = "https://github.com/ybdn-ei/wsq-codec"
documentation = "https://docs.rs/wsq-codec"
homepage = "https://github.com/ybdn-ei/wsq-codec"
readme = "README.md"
keywords = ["wsq", "fingerprint", "biometrics", "image", "codec"]
categories = ["multimedia::images", "compression"]
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/docs/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
image = { version = "0.25.8", default-features = false, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "quality"
harness = false
