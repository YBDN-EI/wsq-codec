[package]
name = "wsq-codec"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Decoder and encoder for WSQ (Wavelet Scalar Quantization) fingerprint images"
license = "MIT"
repository = "https://github.com/ybdn/wsq-codec"
documentation = "https://docs.rs/wsq-codec"
homepage = "https://github.com/ybdn/wsq-codec"
readme = "README.md"
keywords = ["wsq", "fingerprint", "biometrics", "image", "codec"]
categories = ["multimedia::images", "compression"]
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/examples/**",
    "/docs/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
image = { version = "0.25.8", default-features = false, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "codec"
harness = false

# The accuracy requirements of `cert compare` have unit tests.
[[example]]
name = "wsq"
path = "examples/wsq/main.rs"
test = true
