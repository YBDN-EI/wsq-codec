[workspace]
members = ["certified", "cli", "wasm", "capi", "python"]

[package]
name = "wsq-codec"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Decoder and encoder for WSQ (Wavelet Scalar Quantization) fingerprint images"
license = "MIT"
repository = "https://github.com/ybdn/wsq-codec"
documentation = "https://docs.rs/wsq-codec"
homepage = "https://github.com/ybdn/wsq-codec"
readme = "README.md"
keywords = ["wsq", "fingerprint", "biometrics", "image", "codec"]
categories = ["multimedia::images", "compression"]
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/docs/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
# The certified part, at one exact version: a release of this crate never moves it by itself.
# The version is the one the FBI certificate names (see certified/README.md).
wsq-certified = { version = "=1.0.0", path = "certified" }
image = { version = "0.25.8", default-features = false, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "quality"
harness = false
