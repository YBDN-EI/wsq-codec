# Pull requests into develop/main only: a merge replays nothing, the PR was
# checked. `changes` classifies the diff; every job is skipped when its files
# did not change, and `ci` is the one status to require. On a release
# (workflow_call) everything runs.
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the files of the pull request
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "src/**"
              - "certified/**"
              - "benches/**"
              - "tests/**"
              - "examples/**"
              - "cli/**"
              - "wasm/**" # the demo, wasm/demo, included
              - "capi/**"
              - "python/**"
              - "fuzz/**"
              - "Cargo.*"
              - "deny.toml"
              - ".github/workflows/**"

  core:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ybdn-ei/.github/.github/workflows/rust-ci.yml@main
    with:
      msrv: "1.85"
      feature-sets: '["", "--features image"]'
      extra-test-packages: -p wsq-certified -p wsq-cli
    secrets: inherit

  bench:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo bench --bench codec -- 1 1 --check
      - run: cargo bench --bench codec -- 0 1 --check
      - run: cargo bench --bench quality -- --runs 1

  wasm:
    name: build (wasm32-unknown-unknown)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --target wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown --features image

  # The npm package and its demo: the wasm crate built and tested as wasm-pack does, the tests run
  # under Node.js (wasm-bindgen-test), and the package built by `wasm/build.sh` loaded back from a
  # tarball in Node.js, as ESM and as CommonJS. wasm-pack and the wasm-bindgen CLI it needs are
  # built from crates.io at fixed versions; rust-cache keeps the binaries between runs.
  npm:
    name: wasm-pack (npm package)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --version 0.15.1 --locked
      - name: Record the tools
        run: |
          node --version
          npm --version
          wasm-pack --version
      - run: cargo clippy -p wsq-wasm --all-targets -- -D warnings
      - run: cargo clippy -p wsq-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test -p wsq-wasm
      - run: wasm-pack test --node wasm
      - name: Build the package
        run: wasm/build.sh
      - name: Load the package in Node.js
        run: node wasm/scripts/check-package.mjs wasm/pkg wasm/demo/sample.wsq

  # 32-bit address space: a 65535 by 65535 header must give an error, not a
  # "capacity overflow" panic (see the allocation notes in `src/mem.rs`).
  i686:
    name: test (i686-unknown-linux-gnu)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the 32-bit C toolchain
        timeout-minutes: 10
        run: |
          # The runner's resolver sometimes cannot resolve the Ubuntu archive hosts (it failed
          # the v1.0.0 release run three times); apt then hangs and fails. In that case, resolve
          # the main archive over DNS-over-HTTPS, pin it in /etc/hosts and use it as the mirror.
          if ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            ip=$(curl -fsS --retry 3 -H 'accept: application/dns-json' \
              'https://cloudflare-dns.com/dns-query?name=archive.ubuntu.com&type=A' \
              | jq -r '[.Answer[] | select(.type == 1) | .data][0]')
            echo "$ip archive.ubuntu.com security.ubuntu.com" | sudo tee -a /etc/hosts
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y gcc-multilib
      - run: cargo test --release --target i686-unknown-linux-gnu --lib --tests -p wsq-codec -p wsq-certified

  # Determinism on a second architecture, executed: the tests (NBIS fixtures
  # included) and the benchmark's stream hashes on a hosted AArch64 runner.
  aarch64:
    name: test (aarch64-unknown-linux-gnu)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Record the runner
        run: |
          uname -m
          rustc -vV
      - run: cargo test --release --lib --tests -p wsq-codec -p wsq-certified
      - run: cargo bench --bench codec -- 1 1 --check
      - run: cargo bench --bench codec -- 0 1 --check

  # wasm32 executed, not only built: the tests and the benchmark's stream
  # hashes under wasmtime. WASI has no threads, so `src/par.rs` runs every job
  # on the calling thread; the output is the same. `certified/tests/inspect.rs` reads
  # `certified/tests/data` at run time, hence the `--dir` mapping of the checkout to the
  # same path inside the guest.
  wasi:
    name: test (wasm32-wasip1)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Built from crates.io at a fixed version with the lockfile it was
      # published with; rust-cache keeps the binary between runs.
      - name: Install wasmtime
        run: command -v wasmtime || cargo install wasmtime-cli --version 50.0.1 --locked
      - name: Record the runner
        run: |
          uname -m
          rustc -vV
          wasmtime --version
      - run: cargo test --release --target wasm32-wasip1 --lib --tests -p wsq-codec -p wsq-certified
      - run: cargo bench --bench codec --target wasm32-wasip1 -- 1 1 --check
      - run: cargo bench --bench codec --target wasm32-wasip1 -- 0 1 --check

  # Python bindings (python/, issue #49): the wheel is built with maturin on the three operating
  # systems and the round-trip tests run against the installed wheel, from outside python/ so
  # that the package under test is the wheel and not the source directory. The wheel is abi3
  # (one per platform for CPython 3.9 and later), so one interpreter version per system is
  # enough to test it; Linux also tests the oldest and the newest.
  python:
    name: python (${{ matrix.os }}, ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: cargo clippy -p wsq-python --all-targets -- -D warnings
      - name: Install the build and test tools
        run: python -m pip install maturin numpy pytest
      - name: Build the wheel
        run: maturin build --release --manifest-path python/Cargo.toml --out dist
      - name: Build the source distribution
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: maturin sdist --manifest-path python/Cargo.toml --out dist-sdist
      - name: Install the wheel
        run: python -m pip install --no-index --no-deps --find-links dist wsq-codec
      - name: Round-trip tests
        run: python -m pytest python/tests -v

  # The certified crate on the compiler the certificate names (certified/rust-toolchain.toml):
  # built, linted and tested with it, and the benchmark's stream hashes through wsq-codec. rustup
  # reads the file from the working directory, hence `working-directory: certified` on every
  # step; the other jobs use the stable and MSRV toolchains and are not affected, because the
  # file is not at the repository root. The step that records the compiler fails if rustup did
  # not apply the pin.
  certified:
    name: certified (pinned toolchain)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: certified
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Record the compiler
        run: |
          rustc -vV
          cargo -V
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          if [ "$pinned" != "$actual" ]; then
            echo "::error::rustc is $actual, rust-toolchain.toml pins $pinned"
            exit 1
          fi
      - name: Check the exact-version pins of wsq-certified
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          for manifest in ../Cargo.toml ../cli/Cargo.toml; do
            if ! grep -q "^wsq-certified = { version = \"=$version\"" "$manifest"; then
              echo "::error::$manifest does not depend on wsq-certified =$version"
              exit 1
            fi
          done
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release -p wsq-cli
      - run: cargo test --release
      - run: cargo test --release --test nbis -- --ignored
      - run: cargo test --release -p wsq-cli
      - run: cargo bench -p wsq-codec --bench codec -- 1 1 --check
      - run: cargo bench -p wsq-codec --bench codec -- 0 1 --check

  # Any change to certified/ is a new version to certify (certified/README.md): a pull request
  # that changes its code, tests or manifest must raise `version` in certified/Cargo.toml.
  # Markdown files are exempt (they are not built). Pull requests only.
  certified-version:
    name: certified version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit must be there
      - name: Compare with the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- certified ':!certified/*.md')
          if [ -z "$changed" ]; then
            echo "certified/ is unchanged (Markdown files aside)"
            exit 0
          fi
          echo "Changed under certified/:"
          echo "$changed"
          version_in() {
            git show "$1:certified/Cargo.toml" 2>/dev/null | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1
          }
          base=$(version_in "$BASE_SHA")
          head=$(version_in HEAD)
          if [ -z "$base" ]; then
            echo "certified/ is new in this pull request (version $head)"
            exit 0
          fi
          newest=$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -n 1)
          if [ "$head" = "$base" ] || [ "$newest" != "$head" ]; then
            echo "::error::certified/ changed but its version is $head (base: $base). Any change to wsq-certified is a new version to certify: raise version in certified/Cargo.toml, update the pins in Cargo.toml and cli/Cargo.toml, and add a section to certified/CHANGELOG.md."
            exit 1
          fi
          if ! grep -qx "## $head" certified/CHANGELOG.md; then
            echo "::error::certified/CHANGELOG.md has no '## $head' section"
            exit 1
          fi
          echo "certified/ changed and its version went from $base to $head"

  package:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy -p wsq-cli --all-targets -- -D warnings
      # Both crates in one command: wsq-codec depends on wsq-certified at an exact version, and
      # cargo (1.90 and later) verifies it against the package just made, so that this passes
      # before wsq-certified is on crates.io.
      - run: cargo package -p wsq-certified -p wsq-codec

  # The public API is frozen from 1.0 (docs/api-1.0.md). The baseline is the latest release on
  # crates.io, the default: cargo-semver-checks takes the kind of release from the difference
  # between that version and the one in Cargo.toml. While 1.0.0 is unpublished the baseline is
  # 0.2.0 and the breaking changes of 1.0 are allowed; once 1.0.0 is out, a pull request that
  # breaks the API fails here unless it also raises the major version. All features are
  # checked: the `image` feature's API is public too.
  # Built from crates.io at a fixed version with its lockfile; rust-cache keeps the binary
  # between runs. Raise the version when a stable release changes the rustdoc JSON format
  # and the job reports it cannot read it.
  semver:
    name: cargo-semver-checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-semver-checks
        run: command -v cargo-semver-checks || cargo install cargo-semver-checks --version 0.51.0 --locked
      - run: cargo semver-checks check-release -p wsq-codec --all-features
      # cargo-semver-checks cannot see through a re-export from another crate: the items that
      # wsq-codec re-exports from wsq-certified (the decoder, the errors, `inspect`, ...) are
      # only checked here, on the crate that defines them. Skipped while wsq-certified is not on
      # crates.io (no baseline); once it is, a breaking change to it needs a major version, and
      # as it is certified, a new certification.
      - name: cargo-semver-checks for wsq-certified
        run: |
          if cargo search wsq-certified --limit 1 | grep -q '^wsq-certified = '; then
            cargo semver-checks check-release -p wsq-certified
          else
            echo "wsq-certified is not on crates.io yet: nothing to compare with"
          fi

  # The C API (#50): the library, its tests and a C program that encodes and decodes through
  # it, on the three desktop operating systems. `cargo test` compiles `capi/tests/roundtrip.c`
  # with the platform's C compiler (MSVC's `cl` on Windows, found by the `cc` crate) and links it
  # to the shared and to the static library. Linux also runs it under AddressSanitizer and UBSan.
  capi:
    name: capi (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt -p wsq-capi --check
      - run: cargo clippy -p wsq-capi --all-targets -- -D warnings
      - run: cargo build --release -p wsq-capi
      - run: cargo test -p wsq-capi
      - name: C program under AddressSanitizer and UBSan
        if: runner.os == 'Linux'
        env:
          WSQ_C_SANITIZE: "1"
        run: cargo test -p wsq-capi --test c_roundtrip

  # `capi/include/wsq.h` is generated by cbindgen and committed: regenerating it must give no
  # difference. cbindgen is pinned, since its output can change between versions.
  capi-header:
    name: capi header is up to date
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cbindgen
        run: command -v cbindgen || cargo install cbindgen --version 0.29.4 --locked
      - name: Regenerate the header
        run: cbindgen --config capi/cbindgen.toml --crate wsq-capi --output capi/include/wsq.h
      - name: Check that it did not change
        run: git diff --exit-code -- capi/include/wsq.h

  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The one status to read: green when every needed job passed or was skipped.
  ci:
    if: ${{ !cancelled() }}
    needs: [changes, core, bench, wasm, npm, i686, aarch64, wasi, python, certified, certified-version, package, semver, capi, capi-header, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo ok
