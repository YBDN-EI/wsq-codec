name: Release

# Publishes to crates.io through Trusted Publishing (OIDC, no stored token) when a `v*` tag
# is pushed on `main`. A manual run does everything except publish unless `dry_run` is off.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and `cargo publish --dry-run`, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tag, version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $REF_NAME is not on main"
              exit 1
            fi
          fi
          if ! grep -qx "## $version" CHANGELOG.md; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::CHANGELOG.md has no '## $version' section (ignored in a dry run)"
              exit 0
            fi
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi

  ci:
    name: checks
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cargo publish --dry-run
      - name: Authenticate to crates.io
        if: github.event_name == 'push' || !inputs.dry_run
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
