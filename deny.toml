# cargo-deny configuration, run in CI as `cargo deny check`
# and `cargo deny --all-features check` (the optional `image` integration).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The crate is MIT; these are the permissive licenses its dependencies may carry.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
