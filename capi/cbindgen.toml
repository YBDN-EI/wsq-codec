# Generates include/wsq.h from src/lib.rs:
#
#   cargo install cbindgen --locked
#   cbindgen --config capi/cbindgen.toml --crate wsq-capi --output capi/include/wsq.h
#
# (CI regenerates it and fails on a difference.) The header is committed so that C users never
# need cbindgen or Rust to read it.

language = "C"
header = """/*
 * wsq.h - C API of wsq-codec, a WSQ (Wavelet Scalar Quantization) fingerprint image codec.
 *
 * GENERATED by cbindgen from capi/src/lib.rs: do not edit by hand. See capi/README.md for the
 * ownership rules, thread safety, error codes and the ABI policy.
 */"""
include_guard = "WSQ_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
# `usize::MAX`: cbindgen cannot express it, so the constant is written here (and is
# `cbindgen:ignore` in the source).
after_includes = """

/* A decoding limit meaning "no limit": wsq_decode_options.max_pixels set to this lets a
 * stream claim an image of any size the format can describe (at most 65535 by 65535). */
#define WSQ_NO_PIXEL_LIMIT SIZE_MAX"""
line_length = 100
tab_width = 4
braces = "SameLine"

[export]
# Not reachable from a function signature: the values of `wsq_encode_options.profile`.
include = ["wsq_profile"]

[enum]
# The variants already carry their prefix (WSQ_OK, WSQ_PROFILE_...).
prefix_with_name = false

[fn]
args = "auto"

[parse]
parse_deps = false
